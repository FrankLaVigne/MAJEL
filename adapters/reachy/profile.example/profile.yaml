# Example agent profile for the MAJEL Reachy adapter. A real profile is private: keep it
# outside this repository, next to its persona, facts and peer credentials.
# Relative paths are relative to this file.

name: Robin
# Spellings speech recognition produces for the name; any of them gets its attention.
aliases: [robin, robyn]
owner: Alex
voice: af_heart            # text-to-speech voice; the console can override it
persona: persona.md        # system prompt, optional YAML front matter
facts: facts.md            # standing facts, one per line after a title line
about: "I'm Robin, Alex's assistant, speaking to you through this little robot."
# Names to bias speech recognition toward.
stt_hint: "Robin, Alex, Reachy."

# Optional: a peer agent with an OpenAI-compatible chat API that the agent may consult,
# read-only. Its URL and key live in a private env file, never here.
